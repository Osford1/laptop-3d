<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>embed example — 420 × 760</title>
</head>
<body style="margin:0;background:#0b0b0b;display:grid;place-items:center;min-height:100vh">
<!-- Measured: at 420 wide the stage renders 349 px wide with nothing clipped, the kit runtime
     is live and a finger drag turns the machine. Height: 760 fits the plate; give the iframe
     the page's own height (~1050) to avoid an inner scrollbar, or leave `loading="lazy"` and
     let it scroll. -->
<iframe src="./dist/laptop-dark.html" title="A laptop on a turn table — an interactive isometric figure"
        loading="lazy" style="border:0;width:420px;height:760px"></iframe>
</body>
</html>
